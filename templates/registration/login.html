{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="icon-circle">{% include "partials/icon.html" with name="login" cls="size-6" %}</div>
  <h1 class="text-center">Connexion</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn mt-2 w-full" type="submit">{% include "partials/icon.html" with name="login" %} Se connecter</button>
  </form>
</div>
{% endblock %}
