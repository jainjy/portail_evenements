{% extends "base.html" %}
{% block title %}{{ titre_page }}{% endblock %}
{% block content %}
<div class="card mx-auto max-w-2xl">
  <div class="mb-6 flex items-center gap-3 border-b border-slate-100 pb-4">
    <span class="flex size-10 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">{% include "partials/icon.html" with name="calendar-days" cls="size-5" %}</span>
    <h1 class="!mb-0">{{ titre_page }}</h1>
  </div>
  <form method="post" novalidate>{% csrf_token %}
    {{ form.as_p }}
    <div class="mt-6 flex flex-wrap gap-3 border-t border-slate-100 pt-5">
      <button class="btn" type="submit">{% include "partials/icon.html" with name="check" %} Enregistrer</button>
      <a class="btn gris" href="{% url 'gestion_evenements' %}">{% include "partials/icon.html" with name="x-mark" %} Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
