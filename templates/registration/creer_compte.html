{% extends "base.html" %}
{% block title %}Créer un compte{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="icon-circle">{% include "partials/icon.html" with name="user-plus" cls="size-6" %}</div>
  <h1 class="text-center">Créer un compte</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <button class="btn mt-2 w-full" type="submit">{% include "partials/icon.html" with name="user-plus" %} Créer mon compte</button>
  </form>
</div>
{% endblock %}
